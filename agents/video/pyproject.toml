[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "gp-agent-video"
version = "0.1.0"
description = "Video agent — Turns a script into a narrated lesson video with slides."
requires-python = ">=3.11"
dependencies = ["gp-contracts", "gp-exporters[video]"]

[project.optional-dependencies]
test = ["gp-adapters"]

# The worker discovers agents through this entry point. It never imports an agent by name.
[project.entry-points."gp.agents"]
video = "agents.video.agent:VideoAgent"

[tool.setuptools.packages.find]
where = ["src"]
include = ["agents.video*"]
namespaces = true

[tool.setuptools.package-data]
"agents.video" = ["manifest.json", "prompts/*.md"]
