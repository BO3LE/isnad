[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "gp-agent-writer"
version = "0.1.0"
description = "Writer agent — Turns research notes into an article."
requires-python = ">=3.11"
dependencies = ["gp-contracts"]

[project.optional-dependencies]
test = ["gp-adapters"]

# The worker discovers agents through this entry point. It never imports an agent by name.
[project.entry-points."gp.agents"]
writer = "agents.writer.agent:WriterAgent"

[tool.setuptools.packages.find]
where = ["src"]
include = ["agents.writer*"]
namespaces = true

[tool.setuptools.package-data]
"agents.writer" = ["manifest.json", "prompts/*.md"]
