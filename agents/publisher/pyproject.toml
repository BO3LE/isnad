[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "gp-agent-publisher"
version = "0.1.0"
description = "Publisher agent — Uploads to YouTube or Google Drive."
requires-python = ">=3.11"
dependencies = ["gp-contracts"]

[project.optional-dependencies]
test = ["gp-adapters"]

# The worker discovers agents through this entry point. It never imports an agent by name.
[project.entry-points."gp.agents"]
publisher = "agents.publisher.agent:PublisherAgent"

[tool.setuptools.packages.find]
where = ["src"]
include = ["agents.publisher*"]
namespaces = true

[tool.setuptools.package-data]
"agents.publisher" = ["manifest.json", "prompts/*.md"]
