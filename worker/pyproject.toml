[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "gp-worker"
version = "0.1.0"
description = "C3 — walks the DAG, retries with backoff, parks for approval, writes logs. Knows no specific agent."
requires-python = ">=3.11"
dependencies = [
  "gp-contracts",
  "gp-db",
  "gp-adapters",
  "celery[redis]>=5.4,<6",
  "redis>=5",
  "pydantic-settings>=2.4",
]

[tool.setuptools.packages.find]
where = ["src"]
