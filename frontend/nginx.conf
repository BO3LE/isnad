# Behind Caddy (docker-compose.prod.yml) the browser's scheme arrives as X-Forwarded-Proto; keep it
# instead of overwriting it with this hop's plain "http".
map $http_x_forwarded_proto $forwarded_proto {
  default $http_x_forwarded_proto;
  ""      $scheme;
}

server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # The API is reverse-proxied so the browser talks to one origin in production.
  # Resolved per request through Docker's DNS, not once at startup: after a redeploy recreates `api`
  # with a new IP, a startup-resolved address would keep answering 502 until nginx restarts.
  location /api/ {
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8000;
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass $api_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    client_max_body_size 50m;
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Client-side routing
  location / {
    try_files $uri /index.html;
  }
}
