[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "gp-exporters"
version = "0.1.0"
description = "C6 — pure functions: markdown → PDF, markdown → DOCX, a script and its narration → a lesson MP4 with slides. Input in, bytes out."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
# weasyprint is held to 70.x: to_pdf subclasses its URLFetcher, whose API is new in 70.
pdf = ["weasyprint>=70,<71", "markdown>=3.6", "nh3>=0.3"]
docx = ["python-docx>=1.1"]
# assemble_lesson draws its slides with Pillow; fontTools reads the bundled fonts' character maps.
video = ["pillow>=11", "fonttools>=4.50"]
all = ["gp-exporters[pdf,docx,video]"]
# Test-only: reads the golden PDF's text content back out. Not needed at runtime.
test = ["pypdf>=5"]

[tool.setuptools.packages.find]
where = ["src"]

# The slides' fonts (SIL Open Font License; the licences ship beside them).
[tool.setuptools.package-data]
"exporters" = ["fonts/*.ttf", "fonts/OFL-*.txt"]
