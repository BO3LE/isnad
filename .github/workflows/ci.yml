name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  # ------------------------------------------------------------------ boundaries and lint
  boundaries:
    name: Lint · import boundaries · agent shape
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "${{ env.PYTHON_VERSION }}", cache: pip }
      - name: Install every component
        run: scripts/bootstrap.sh
      - name: ruff
        run: source .venv/bin/activate && ruff check . && ruff format --check .
      - name: Import contract (fails when a component imports across a forbidden edge)
        run: source .venv/bin/activate && lint-imports
      - name: Grep tests from GP-plan Part 2
        run: |
          # GP-plan Part 2: api and worker must not import the C4 agents package.
          # Anchored to the start of an import statement, or it also matches
          # `from api.routers import agents` (C2's own catalogue router) and the line in
          # api/__init__.py that documents this very rule.
          ! grep -rnE '^[[:space:]]*(from|import)[[:space:]]+agents([.[:space:]]|$)' api/src worker/src
      - name: Agent shape (every agent folder has a valid manifest and entry point)
        run: source .venv/bin/activate && python scripts/validate_manifests.py
      - name: landing/site/index.html is up to date
        run: make landing-check

  # ------------------------------------------------------------------ each component tested alone
  python-tests:
    name: Tests · ${{ matrix.component }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: contracts
            install: ./contracts
          - component: db
            install: ./db
          - component: adapters
            install: ./contracts "./adapters[storage]"
          - component: exporters
            install: ./exporters
            ffmpeg: true
          # The worker suite runs with NO agents installed — the C3 decoupling test.
          - component: worker
            install: ./contracts ./db "./adapters[storage]" ./worker
          # The API suite runs with no worker, Redis or PostgreSQL — the C2 decoupling test.
          - component: api
            install: ./contracts ./db ./api[test]
          - component: agents
            install: ./contracts ./adapters ./exporters
            ffmpeg: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "${{ env.PYTHON_VERSION }}", cache: pip }
      - name: Install FFmpeg
        if: matrix.ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Install ${{ matrix.component }} and only what it depends on
        run: pip install -c constraints.txt ${{ matrix.install }} pytest pytest-asyncio
      - name: Run tests
        if: matrix.component != 'agents'
        working-directory: ${{ matrix.component }}
        run: python -m pytest -q
      - name: Run every agent's tests, each agent installed on its own
        if: matrix.component == 'agents'
        run: |
          for agent in agents/*/; do
            echo "::group::${agent}"
            pip install -c constraints.txt "./${agent%/}"
            (cd "$agent" && python -m pytest -q)
            pip uninstall -y "gp-agent-$(basename "$agent")"
            echo "::endgroup::"
          done

  db-migrations:
    name: Migrations round-trip on PostgreSQL 15
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: gp }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gp
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "${{ env.PYTHON_VERSION }}", cache: pip }
      - run: pip install -c constraints.txt ./db
      - name: upgrade → downgrade → upgrade → check for model drift
        working-directory: db
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
          alembic check
      - name: Row Level Security (plain Postgres, then a simulated Supabase)
        env:
          RLS_TEST_DATABASE_URL: ${{ env.DATABASE_URL }}
        run: pip install -c constraints.txt pytest pytest-asyncio && python -m pytest -q db/tests/test_rls.py
      - name: Seed twice (must be idempotent)
        run: python -m db.seed && python -m db.seed

  # ------------------------------------------------------------------ run lifecycle
  # GP-plan W3 (C7): a whole run — queued → running → awaiting_approval → succeeded/failed — through
  # the real orchestrator, SqlRunStore and installed agents against PostgreSQL 15, with fake adapters.
  # No Redis or Celery: the test calls the orchestrator the way the Celery task does. Unlike the
  # docker-compose `integration` job this is cheap, so it runs on every pull request and gates the merge.
  run-lifecycle:
    name: Integration · run lifecycle on PostgreSQL 15
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:15
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: gp }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      INTEGRATION_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gp
      REQUIRE_INTEGRATION_DB: "1"  # a missing database or FFmpeg is a failure here, not a skip
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "${{ env.PYTHON_VERSION }}", cache: pip }
      - name: Install FFmpeg (the video template renders a real MP4)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Install the worker, its dependencies and every agent (no api)
        run: pip install -c constraints.txt ./contracts ./db ./adapters ./exporters ./worker ./agents/*/ pytest pytest-asyncio
      - name: Migrate, seed and run a full lifecycle per template
        run: python -m pytest tests/integration -q

  # ------------------------------------------------------------------ contract drift
  api-contract:
    name: OpenAPI and frontend types are up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "${{ env.PYTHON_VERSION }}", cache: pip }
      - uses: actions/setup-node@v7
        with: { node-version: "${{ env.NODE_VERSION }}", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: pip install -c constraints.txt ./contracts ./db ./api
      - name: contracts/openapi.json matches the API
        run: |
          python -m api.export_openapi
          git diff --exit-code -- contracts/openapi.json || (echo "::error::Run 'make openapi' and commit contracts/openapi.json and frontend/src/lib/api-types.ts" && exit 1)
      - name: frontend/src/lib/api-types.ts matches contracts/openapi.json
        working-directory: frontend
        run: npm ci && npm run check:api-types

  # ------------------------------------------------------------------ frontend
  frontend:
    name: Frontend · lint · typecheck · unit tests · build
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: "${{ env.NODE_VERSION }}", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    name: Frontend end-to-end (mocked API, no backend)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: "${{ env.NODE_VERSION }}", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with: { name: playwright-report, path: frontend/playwright-report, retention-days: 7 }

  # ------------------------------------------------------------------ fullstack e2e (Playwright)
  # GP-plan W10 (C7): the same three template workflows as scripts/smoke_test.py, but driven through
  # the real UI (frontend/e2e-fullstack) against the real stack — sign in, run, approve each
  # template's gate, and check what actually landed on the Outputs page. Complements `e2e` above
  # (mocked API, no backend) rather than replacing it.
  #
  # NOT in ci-ok's `needs` below: building the FFmpeg worker image from scratch plus three real runs
  # (one of them rendering a video) is slower and more environment-dependent than the rest of this
  # workflow, and it has no track record yet. It runs on every pull request so regressions are
  # visible, but it does not block merging. Promote it to ci-ok once it has proven reliable and
  # comfortably under ~10 minutes.
  e2e-fullstack:
    name: Frontend end-to-end (real stack, fake adapters) — informational, not required
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: "${{ env.NODE_VERSION }}", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - name: Start the stack with fake adapters (separate compose project, default ports — CI runner is isolated)
        run: docker compose -p isnad-e2e up -d --build db redis migrate api worker frontend
      - name: Wait for the API, the worker catalog and the frontend to be reachable
        run: |
          ready() {
            curl -sf http://localhost:8000/health/ready \
              | python3 -c 'import json,sys; c=json.load(sys.stdin)["checks"]; sys.exit(0 if c.get("database")=="ok" and c.get("worker_catalog","").startswith(tuple("123456789")) else 1)'
          }
          for i in $(seq 1 90); do
            if ready && curl -sf -o /dev/null http://localhost:5173; then
              echo "stack is ready"; exit 0
            fi
            sleep 2
          done
          echo "::error::stack did not become ready in time"
          docker compose -p isnad-e2e logs --no-color api worker migrate frontend
          exit 1
      - working-directory: frontend
        run: npm ci
      - working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run the fullstack Playwright specs against the running stack
        working-directory: frontend
        env:
          E2E_BASE_URL: http://localhost:5173
        run: npm run test:e2e:fullstack
      - uses: actions/upload-artifact@v7
        if: failure()
        with: { name: playwright-fullstack-report, path: frontend/playwright-report, retention-days: 7 }
      - name: Logs
        if: failure()
        run: docker compose -p isnad-e2e logs --no-color api worker migrate frontend
      - if: always()
        run: docker compose -p isnad-e2e down -v

  # ------------------------------------------------------------------ whole stack
  integration:
    name: Integration · docker compose + smoke test
    # Heavier (builds the FFmpeg worker image). Runs on main and on demand to save CI minutes.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Start the stack with fake adapters
        run: docker compose up -d --build db redis migrate api worker
      - name: Run all three template workflows end to end
        run: python3 scripts/smoke_test.py
      - name: Logs
        if: failure()
        run: docker compose logs --no-color api worker migrate
      - if: always()
        run: docker compose down -v

  # ------------------------------------------------------------------ the gate
  # The single check to require in the branch protection rule for main.
  #
  # Requiring the six jobs by name means editing the rule on GitHub every time one is added or
  # renamed — and a job that is required but never runs blocks every pull request for ever. This
  # job depends on all of them instead, so the rule names one check that can never go stale.
  #
  # `integration` is not here on purpose: it is skipped on pull requests to save CI minutes and
  # runs on main after the merge.
  ci-ok:
    name: CI passed
    if: always()
    needs: [boundaries, python-tests, db-migrations, run-lifecycle, api-contract, frontend, e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Every required job succeeded
        run: |
          results="${{ join(needs.*.result, ' ') }}"
          echo "Results: $results"
          for result in $results; do
            if [ "$result" != "success" ]; then
              echo "::error::A required job did not pass (saw: $results). This pull request is not mergeable."
              exit 1
            fi
          done
          echo "All required jobs passed."
