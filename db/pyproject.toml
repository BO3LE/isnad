[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "gp-db"
version = "0.1.0"
description = "C7 — schema, migrations, seed data. Stores rows; knows nothing about agents."
requires-python = ">=3.11"
dependencies = [
  "sqlalchemy>=2.0.36,<2.1",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
]

[tool.setuptools.packages.find]
where = ["src"]
